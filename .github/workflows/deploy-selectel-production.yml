name: Selectel production deployment

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: selectel-production
      cancel-in-progress: false
    environment:
      name: selectel-production
      url: https://zolotoy.dev
    env:
      VITE_API_MODE: mock
      VITE_DEPLOY_ENV: production
    steps:
      - name: Require main and a permitted event
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$REF" = refs/heads/main
          test "$EVENT" = push || test "$EVENT" = workflow_dispatch

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies for exact checked commit
        run: npm ci

      - name: Build static production assets
        run: npm run build

      - name: Package with per-file SHA-256 manifest
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 scripts/selectel/package-release.py \
            --dist dist --release "$RELEASE_ID" \
            --output "$RUNNER_TEMP/zolotoy-dev-production.tar.gz"

      - name: Reject obsolete main commits
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          remote_head="$(git ls-remote https://github.com/Officialsayp/zolotoy-dev-frontend.git refs/heads/main | cut -f1)"
          if [ "$remote_head" != "$EXPECTED_SHA" ]; then
            echo "The main branch has advanced; refusing obsolete deployment" >&2
            exit 1
          fi

      - name: Deploy to isolated Selectel production and verify or roll back
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          VPS_PRODUCTION_HOST: ${{ secrets.VPS_PRODUCTION_HOST }}
          VPS_PRODUCTION_USER: ${{ secrets.VPS_PRODUCTION_USER }}
          VPS_PRODUCTION_SSH_KEY: ${{ secrets.VPS_PRODUCTION_SSH_KEY }}
          VPS_PRODUCTION_KNOWN_HOSTS: ${{ secrets.VPS_PRODUCTION_KNOWN_HOSTS }}
        run: |
          bash scripts/selectel/deploy-production.sh \
            "$RELEASE_ID" "$RUNNER_TEMP/zolotoy-dev-production.tar.gz"
