name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_production:
        description: 'Publish the verified main commit to Selectel production'
        type: boolean
        required: true
        default: false

# Least privilege: checkout only needs read access to contents; the Node cache
# and artifact upload use the runner's runtime token, not the GitHub token.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_MODE: mock
      VITE_DEPLOY_ENV: production
    outputs:
      release_id: ${{ steps.package.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (type-check + static generation + site checks)
        run: npm run build

      # Read-only Caddyfile regression: no ACME orders, VPS access or reload.
      - name: Verify tracked production TLS baseline and offline migration candidate
        run: |
          node scripts/generate-selectel-production.mjs --check
          node scripts/selectel-production/render-caddy-automatic-https.mjs --check
          node --test scripts/selectel-production/test-automatic-https.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E desktop and mobile against the exact built Worker/assets
        run: npm run test:e2e:built-worker

      - name: Install verified Caddy test binary
        run: bash scripts/install-caddy.sh

      - name: Parse Automatic HTTPS candidate without provisioning certificates
        run: .tools/bin/caddy adapt --config deploy/caddy/zolotoy-dev-production.automatic-https.caddy --adapter caddyfile > /dev/null

      - name: Compare Worker and Linux Caddy responses
        run: npm run check:selectel

      - name: Verify Caddy TLS and release smoke
        run: npm run check:selectel:tls

      - name: E2E desktop and mobile against the exact built Caddy assets
        run: npm run test:e2e:selectel

      - name: Production transaction safety tests
        run: python3 -B -m unittest discover -s scripts/selectel -p 'test_production*.py' -v

      # Local fixtures only. Preserve TLS recovery logic without contacting
      # Let's Encrypt, restarting Caddy or accessing production secrets.
      - name: TLS renewal recovery regression tests
        run: |
          bash -n scripts/selectel-production/renew-certificate.sh scripts/selectel-production/install-certificate.sh
          python3 -B -m unittest discover -s scripts/selectel-production -p 'test_*.py' -v

      - name: Package the exact verified production build
        id: package
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 scripts/selectel/package-release.py \
            --dist dist --release "$RELEASE_ID" \
            --output "$RUNNER_TEMP/zolotoy-dev-production.tar.gz"
          printf 'release_id=%s\n' "$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Retain the verified production archive
        uses: actions/upload-artifact@v4
        with:
          name: selectel-production-${{ steps.package.outputs.release_id }}
          path: ${{ runner.temp }}/zolotoy-dev-production.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  deploy-production:
    name: Selectel production (after verify)
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.SELECTEL_PRODUCTION_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_production == true))
    uses: ./.github/workflows/deploy-selectel-production.yml
    with:
      release_id: ${{ needs.verify.outputs.release_id }}
    secrets: inherit
