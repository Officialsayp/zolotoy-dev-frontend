# === SERVER ===
# Include inside each HTTPS server; wrapper owns root/server_name/listen/TLS.
# Requires ngx_http_js_module and ngx_http_headers_more_filter_module.
js_import zd from /etc/nginx/zolotoy-routes.js;
js_var $zd_cache '';
js_var $zd_robots '';
js_var $zd_file '';
js_var $zd_vary '';

charset utf-8;
charset_types text/plain text/css application/javascript application/json application/xml text/javascript;
absolute_redirect off;
gzip off;

location / {
    js_header_filter zd.headers;
    js_content zd.dispatch;
}

location @zd_static {
    js_header_filter zd.headers;
    max_ranges 0;
    try_files $zd_file =404;
    error_page 404 = @zd_asset_error;
}

location @zd_demo_static {
    js_header_filter zd.headers;
    max_ranges 0;
    more_clear_input_headers Range If-None-Match If-Modified-Since;
    try_files $zd_file =404;
    error_page 404 = @zd_asset_error;
}

location @zd_sitemap {
    js_header_filter zd.headers;
    max_ranges 0;
    types { application/xml xml; }
    try_files $zd_file =404;
    error_page 404 = @zd_asset_error;
}

location @zd_release {
    js_header_filter zd.headers;
    try_files $zd_file =404;
    error_page 404 = @zd_asset_error;
}

location @zd_notfound {
    js_header_filter zd.headers;
    error_page 418 =404 @zd_static;
    return 418;
}

location @zd_asset_error {
    js_header_filter zd.headers;
    js_content zd.assetError;
}
