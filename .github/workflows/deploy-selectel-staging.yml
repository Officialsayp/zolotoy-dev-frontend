name: Deploy Selectel staging (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Deploy the checked mock build only to origin.zolotoy.dev'
        type: choice
        required: true
        options:
          - Deploy Selectel staging

permissions:
  contents: read

# Never cancel a transaction midway through activation; the remote flock also
# protects against concurrent manual operations outside GitHub Actions.
concurrency:
  group: selectel-staging-deployment
  cancel-in-progress: false

env:
  VITE_API_MODE: mock
  VITE_DEPLOY_ENV: selectel-staging

jobs:
  nginx-profile:
    uses: ./.github/workflows/verify-nginx.yml

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require a manual main-branch run
        env:
          REQUESTED_REF: ${{ github.ref }}
          REQUESTED_EVENT: ${{ github.event_name }}
        run: |
          test "$REQUESTED_EVENT" = workflow_dispatch
          test "$REQUESTED_REF" = refs/heads/main

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Type-check, build mock, prerender, and site checks
        run: npm run build

      - name: Local release and rollback transaction tests
        run: python3 -B -m unittest discover -s scripts/selectel -p 'test_*.py' -v

      - name: Install the pinned Caddy test binary
        run: bash scripts/install-caddy.sh

      - name: Compare Caddy and Worker HTTP behavior
        run: npm run check:selectel

      - name: Verify local Caddy TLS and HTTPS redirects
        run: npm run check:selectel:tls

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright desktop and mobile against the Worker
        run: npm run test:e2e:built-worker

      - name: Playwright desktop and mobile against Caddy
        run: npm run test:e2e:selectel

      - name: Package the exact checked build
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/selectel/package-release.py --dist dist --release "$RELEASE_ID" --output "$RUNNER_TEMP/selectel-release.tar.gz"

      - name: Upload the checked release
        uses: actions/upload-artifact@v4
        with:
          name: selectel-staging-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/selectel-release.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selectel-staging-browser-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: [verify, nginx-profile]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: selectel-staging
      url: https://origin.zolotoy.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: selectel-staging-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/selectel-artifact

      - name: Verified SSH upload, atomic activation, TLS smoke, and automatic rollback
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_ORIGIN_HOST: ${{ vars.VPS_ORIGIN_HOST }}
        run: bash scripts/selectel/deploy.sh "$RELEASE_ID" "$RUNNER_TEMP/selectel-artifact/selectel-release.tar.gz"
